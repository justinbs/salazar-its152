<a routerLink="/">← Back to list</a>

<div *ngIf="loading">Loading...</div>
<div *ngIf="error" style="color:crimson">{{ error }}</div>

<div *ngIf="!loading && !error && post">
  <h2>{{ post.title }}</h2>
  <div style="white-space: pre-wrap; margin-top: 8px;">
    {{ post.body || post.content }}
  </div>
  <div style="margin-top: 12px; font-size: 12px; color:#666;">
    <span *ngIf="post.author">Author: {{ post.author }}</span>
    <span *ngIf="post.createdAt"> | {{ post.createdAt }}</span>
  </div>
</div>
